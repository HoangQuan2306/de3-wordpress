name: de3-wordpress

x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
  wp_data:

services:
  nginx:
    <<: *hardened
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    networks: [frontend]
    depends_on: [wordpress, phpmyadmin]

  wordpress:
    <<: *hardened
    image: wordpress:6.6-apache
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('FORCE_SSL_ADMIN', true);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp_data:/var/www/html
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
    networks: [frontend, backend]
    depends_on:
      mysql:
        condition: service_healthy

  phpmyadmin:
    <<: *hardened
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: mysql
      PMA_ABSOLUTE_URI: https://${DOMAIN}/phpmyadmin/
      UPLOAD_LIMIT: 20M
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    networks: [frontend, backend]
    depends_on: [mysql]

  mysql:
    <<: *hardened
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    networks: [backend]          # không có ports: DB không lộ ra host
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
